<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Обучение ПДД</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --error: #dc2626;
      --error-bg: #fef2f2;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 16px 8px;
      min-height: 100vh;
    }

    .app-card {
      max-width: 860px;
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      gap: 16px;
      border: 1px solid var(--border);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border);
      padding-bottom: 14px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stats {
      font-size: 14px;
      font-weight: 700;
    }

    .stat-ok { color: var(--success); }
    .stat-err { color: var(--error); }

    .tickets-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 6px;
    }

    .ticket-btn {
      padding: 8px 14px;
      border: 1px solid var(--border);
      background: #f1f5f9;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      font-size: 13px;
      color: var(--text-muted);
      white-space: nowrap;
      transition: all 0.2s;
    }

    .ticket-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .ticket-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 600;
    }

    .canvas-wrapper {
      width: 100%;
      height: 300px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background-color: #0f172a;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .q-title {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.4;
    }

    .answers-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ans-btn {
      padding: 12px 16px;
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 8px;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s;
      line-height: 1.4;
    }

    .ans-btn:hover:not(:disabled) {
      background: #f1f5f9;
      border-color: var(--primary);
    }

    .ans-btn.correct {
      background: var(--success-bg) !important;
      border-color: var(--success) !important;
      color: #15803d;
      font-weight: 700;
    }

    .ans-btn.wrong {
      background: var(--error-bg) !important;
      border-color: var(--error) !important;
      color: #b91c1c;
      font-weight: 700;
    }

    .explanation {
      padding: 14px 16px;
      background: #eff6ff;
      border-left: 4px solid var(--primary);
      border-radius: 0 8px 8px 0;
      display: none;
    }

    .exp-title {
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 4px;
      font-size: 14px;
    }

    .exp-body {
      font-size: 14px;
      color: #1e40af;
      line-height: 1.4;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
    }

    .nav-btn {
      padding: 10px 22px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .nav-btn:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .nav-btn:disabled {
      background: var(--border);
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <header>
      <div class="logo">🚗 Обучение ПДД</div>
      <div class="stats">
        Верно: <span id="correct-count" class="stat-ok">0</span> | 
        Ошибок: <span id="wrong-count" class="stat-err">0</span>
      </div>
    </header>

    <!-- Переключатель билетов -->
    <div class="tickets-scroll" id="tickets-scroll"></div>

    <!-- Метаданные текущего вопроса -->
    <div class="meta-bar">
      <span id="ticket-info">Билет №1</span>
      <span id="question-progress">Вопрос 1 из 20</span>
    </div>

    <!-- Динамическая 2D/3D схема дорожной ситуации на HTML5 Canvas -->
    <div class="canvas-wrapper">
      <canvas id="pdd-canvas" width="800" height="300"></canvas>
    </div>

    <!-- Заголовок вопроса и варианты ответов -->
    <div class="q-title" id="question-text">Загрузка вопроса...</div>
    <div class="answers-grid" id="answers-grid"></div>

    <!-- Блок с комментарием и пунктом ПДД -->
    <div class="explanation" id="explanation-box">
      <div class="exp-title">💡 Пояснение ПДД РФ:</div>
      <div class="exp-body" id="explanation-text"></div>
    </div>

    <!-- Кнопки Назад / Далее -->
    <div class="nav-controls">
      <button class="nav-btn" id="prev-btn" onclick="prevQ()">← Назад</button>
      <button class="nav-btn" id="next-btn" onclick="nextQ()">Далее →</button>
    </div>
  </div>

  <script>
    // База билетов и вопросов ПДД
    const db = [
      {
        ticket: 1,
        questions: [
          {
            id: 101,
            text: "Что означает термин «Главная дорога»?",
            scene: "t1_q1",
            options: [
              { text: "Дорога с асфальтобетонным покрытием по отношению к дороге с брусчатым покрытием", correct: false },
              { text: "Дорога, обозначенная знаками 2.1, 2.3.1-2.3.7 или 5.1, по отношению к пересекаемой", correct: true },
              { text: "Любая дорога с двумя и более полосами для движения", correct: false }
            ],
            explanation: "Главной является дорога, обозначенная знаками 2.1, 2.3.1-2.3.7 или 5.1 («Автомагистраль»), либо дорога с твердым покрытием по отношению к грунтовой."
          },
          {
            id: 102,
            text: "Разрешается ли вам произвести остановку в указанном месте?",
            scene: "t1_q2",
            options: [
              { text: "Разрешается", correct: false },
              { text: "Разрешается только для посадки и высадки пассажиров", correct: false },
              { text: "Запрещается", correct: true }
            ],
            explanation: "Знак 3.27 «Остановка запрещена» запрещает остановку и стоянку любых транспортных средств."
          }
        ]
      },
      {
        ticket: 2,
        questions: [
          {
            id: 201,
            text: "В каких случаях разрешается применять звуковые сигналы в населенных пунктах?",
            scene: "t2_q1",
            options: [
              { text: "Только для предотвращения дорожно-транспортного происшествия", correct: true },
              { text: "Для предупреждения других водителей об обгоне", correct: false },
              { text: "В обоих перечисленных случаях", correct: false }
            ],
            explanation: "В населенных пунктах звуковой сигнал разрешен исключительно для предотвращения ДТП (п. 19.10 ПДД)."
          }
        ]
      }
    ];

    let cTicket = 0;
    let cQuestion = 0;
    let stats = { correct: 0, wrong: 0 };

    function init() {
      renderTicketTabs();
      loadQuestion();
    }

    function renderTicketTabs() {
      const scroll = document.getElementById('tickets-scroll');
      scroll.innerHTML = '';
      
      // Генерация кнопок для билетов (от 1 до 40)
      for (let i = 0; i < 40; i++) {
        const ticketNum = i + 1;
        const btn = document.createElement('button');
        btn.className = `ticket-btn ${i === cTicket ? 'active' : ''}`;
        btn.innerText = `Билет №${ticketNum}`;
        btn.onclick = () => {
          cTicket = i < db.length ? i : 0;
          cQuestion = 0;
          renderTicketTabs();
          loadQuestion();
        };
        scroll.appendChild(btn);
      }
    }

    function loadQuestion() {
      const ticket = db[cTicket] || db[0];
      const q = ticket.questions[cQuestion] || ticket.questions[0];

      document.getElementById('ticket-info').innerText = `Билет №${cTicket + 1}`;
      document.getElementById('question-progress').innerText = `Вопрос ${cQuestion + 1} из ${ticket.questions.length}`;
      document.getElementById('question-text').innerText = q.text;
      document.getElementById('explanation-box').style.display = 'none';

      // Отрисовка графической схемы
      drawScene(q.scene || "t1_q1");

      // Рендер вариантов ответов
      const grid = document.getElementById('answers-grid');
      grid.innerHTML = '';

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'ans-btn';
        btn.innerText = `${idx + 1}. ${opt.text}`;
        btn.onclick = () => onSelectAnswer(opt, btn, q);
        grid.appendChild(btn);
      });

      document.getElementById('prev-btn').disabled = cQuestion === 0;
      document.getElementById('next-btn').disabled = cQuestion === ticket.questions.length - 1;
    }

    function onSelectAnswer(opt, selectedBtn, q) {
      const allBtns = document.querySelectorAll('.ans-btn');
      allBtns.forEach(b => b.disabled = true);

      if (opt.correct) {
        selectedBtn.classList.add('correct');
        stats.correct++;
      } else {
        selectedBtn.classList.add('wrong');
        stats.wrong++;
        q.options.forEach((o, idx) => {
          if (o.correct) allBtns[idx].classList.add('correct');
        });
      }

      document.getElementById('correct-count').innerText = stats.correct;
      document.getElementById('wrong-count').innerText = stats.wrong;

      document.getElementById('explanation-text').innerText = q.explanation;
      document.getElementById('explanation-box').style.display = 'block';
    }

    function nextQ() {
      const ticket = db[cTicket] || db[0];
      if (cQuestion < ticket.questions.length - 1) {
        cQuestion++;
        loadQuestion();
      }
    }

    function prevQ() {
      if (cQuestion > 0) {
        cQuestion--;
        loadQuestion();
      }
    }

    // Движок векторной отрисовки ситуации на Canvas
    function drawScene(scene) {
      const cvs = document.getElementById('pdd-canvas');
      const ctx = cvs.getContext('2d');
      const w = cvs.width;
      const h = cvs.height;

      ctx.clearRect(0, 0, w, h);

      if (scene === 't1_q1') {
        ctx.fillStyle = '#166534'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#334155'; ctx.fillRect(0, 110, w, 80); ctx.fillRect(360, 0, 80, h);

        ctx.strokeStyle = '#f8fafc'; ctx.lineWidth = 2; ctx.setLineDash([10, 10]);
        ctx.beginPath(); ctx.moveTo(0, 150); ctx.lineTo(360, 150); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(440, 150); ctx.lineTo(w, 150); ctx.stroke();
        ctx.setLineDash([]);

        drawSignMainRoad(ctx, 320, 70);
        drawCar(ctx, 220, 160, '#ef4444', 0);
        drawCar(ctx, 400, 60, '#3b82f6', 90);
      } 
      else if (scene === 't1_q2') {
        ctx.fillStyle = '#1e293b'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#475569'; ctx.fillRect(0, 80, w, 150);
        ctx.fillStyle = '#94a3b8'; ctx.fillRect(0, 230, w, 70);
        
        drawSignNoStopping(ctx, 260, 45);
        drawCar(ctx, 360, 195, '#ef4444', 0);
      }
      else {
        ctx.fillStyle = '#065f46'; ctx.fillRect(0, 0, w, h);
        ctx.fillStyle = '#334155'; ctx.fillRect(0, 80, w, 140);
        
        ctx.fillStyle = '#ffffff';
        for (let y = 90; y < 210; y += 20) ctx.fillRect(400, y, 40, 10);
        
        drawCar(ctx, 240, 120, '#3b82f6', 0);
      }
    }

    function drawCar(ctx, x, y, color, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(-26, -13, 52, 26, 6);
      ctx.fill();

      ctx.fillStyle = '#0f172a';
      ctx.fillRect(-10, -10, 16, 20);

      ctx.fillStyle = '#fef08a';
      ctx.fillRect(22, -10, 4, 5);
      ctx.fillRect(22, 5, 4, 5);

      ctx.restore();
    }

    function drawSignMainRoad(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#facc15'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, -16); ctx.lineTo(16, 0); ctx.lineTo(0, 16); ctx.lineTo(-16, 0);
      ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.restore();
    }

    function drawSignNoStopping(ctx, x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = '#2563eb'; ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-10, -10); ctx.lineTo(10, 10);
      ctx.moveTo(10, -10); ctx.lineTo(-10, 11);
      ctx.stroke();
      ctx.restore();
    }

    window.onload = init;
  </script>
</body>
</html>
